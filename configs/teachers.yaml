teachers:
  clip_patch_baseline:
    role: mvp_baseline
    status: runnable
    model_name: openai/clip-vit-base-patch16
    feature_granularity: coarse_patch
    intended_use: smoke_test_and_baseline
    note: >
      CLIP patch tokens are too coarse for final point-level 2D-to-3D distillation.
      Keep this backend only as the MVP baseline.

  clipseg_dense:
    role: runnable_dense_teacher
    status: runnable
    model_name: CIDAS/clipseg-rd64-refined
    feature_granularity: dense_class_logits
    intended_use: dense_teacher_v6a
    note: >
      Runnable dense class-logit teacher. It is stronger than CLIP patch tokens for
      projected point supervision, but should still be treated as a weak baseline.

  groupvit_dense:
    role: transformers_native_dense_teacher
    status: runnable
    model_name: nvidia/groupvit-gcc-yfcc
    feature_granularity: dense_class_logits
    intended_use: dense_teacher_v12
    note: >
      Single-environment dense open-vocabulary teacher through Hugging Face Transformers.
      V12 showed it needs teacher-quality gating before distillation is trusted.
